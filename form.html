<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Dynamic Web Fundamentals – Franco Sanchez</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals">
    <meta name="author" content="Franco Sanchez">
    <link rel="stylesheet" href="styles/base.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header id="formtit"><h1>Form</h1></header>
    <div class="container">
    <form action="review.html" method="get">
        
        <div class="listing">
            <label for="product-select">Choose your item:</label>
            <select id="product-select" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            </select>
        </div>
        <div class="startest"><p>Overall rating:</p>
        <div class="star-rating">
            <input type="radio" name="stars" id="star-a" value="1"/>
            <label for="star-a"></label>

            <input type="radio" name="stars" id="star-b" value="2"/>
            <label for="star-b"></label>

            <input type="radio" name="stars" id="star-c" value="3"/>
            <label for="star-c"></label>

            <input type="radio" name="stars" id="star-d" value="4"/>
            <label for="star-d"></label>

            <input type="radio" name="stars" id="star-e" value="5"/>
            <label for="star-e"></label>
        </div>
        </div>
        <div class="insdate">
            <label for="install-date">Installation Date:</label>
            <input type="date" id="install-date" name="install-date" required>
        </div>
        <div>
            <fieldset>
                <legend>Select all features you found useful:</legend>

                <label for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="fast_performance">
                    Fast Performance
                </label><br>

                <label for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="user_interface">
                    User Interface
                </label><br>

                <label for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="offline_mode">
                    Offline Mode
                </label><br>

                <label for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="customer_support">
                    Customer Support
                </label>
            </fieldset>
        </div>
        <div class="writtenbox">
            <label for="user-review">Written review <span class="blu">(optional)</span></label>
            <textarea id="user-review" name="user_review"></textarea>
        </div>
        <div class="single-slot-text">
            <label for="username">Username: <span class="blu">(optional)</span></label>
            <input type="text" id="username" name="username">
        </div>
        <button type="submit">Submit</button>
    </form>
    </div>
    <footer>
    <p>©<span id="currentyear"></span> Franco Sanchez - Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
